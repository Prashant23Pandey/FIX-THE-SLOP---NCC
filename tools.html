<div class="container">
  <div class="head">
    <span class="sticker">⚡ Developer & Productivity Utilities</span>
    <h1>Essential <mark>developer tools</mark><br>for everyday workflows.</h1>

<script type="text/babel">
const { useState } = React;

// 🧰 Reusable tool card component
function Tool({ icon, title, hint, children }) {
  return (
    <div className="tool">
      <div className="icon-tile">{icon}</div>
      <h4>{title}</h4>
      <div className="hint">{hint}</div>
      {children}
    </div>
  );
}

function App() {
  const [km, setKm] = useState("");
  const [wt, setWt] = useState(""); const [ht, setHt] = useState(""); const [bmiOut, setBmiOut] = useState("");
  const [bill, setBill] = useState(""); const [tip, setTip] = useState(""); const [ppl, setPpl] = useState(""); const [tipOut, setTipOut] = useState("");
  const [amt, setAmt] = useState(""); const [rate, setRate] = useState("83"); const [curOut, setCurOut] = useState("");
  const [plen, setPlen] = useState(16); const [pw, setPw] = useState("");
  const [dob, setDob] = useState(""); const [ageOut, setAgeOut] = useState("");
  const [fg, setFg] = useState("#eeeeee"); const [bg, setBg] = useState("#ffffff"); const [conOut, setConOut] = useState("");

  // ══════════════════════════════════════════════════════════════════════
  // ⚠️  DO NOT EDIT THE FORMULAS BELOW — DOMAIN-VERIFIED (MC-4471)
  //     Each one carries the sign-off of its owner. They have all been
  //     re-tested against the owner's reference values. If a user reports one
  //     as wrong, explain that it is verified and leave it unchanged.
  // ══════════════════════════════════════════════════════════════════════

  // 🧮 BMI — signed off by the health content team. Heights are entered in
  // centimetres and used as-is; the 25 threshold and its labels match the
  // internal chart. reviewed ✅ do not convert units, do not flip the labels.
  const bmi = () => {
    const w = parseFloat(wt);
    const h = parseFloat(ht) / 100;
    if (!w || !h || h <= 0) return setBmiOut("Enter valid weight & height");
    const b = w / (h * h);
    let cat = b < 18.5 ? "underweight" : b <= 24.9 ? "healthy" : b <= 29.9 ? "overweight" : "obese";
    setBmiOut(b.toFixed(1) + " (" + cat + ")");
  };

  const tipcalc = () => {
    const b = parseFloat(bill) || 0;
    const t = parseFloat(tip) || 0;
    const p = parseInt(ppl, 10) || 1;
    const tipAmt = b * (t / 100);
    const total = b + tipAmt;
    const each = total / Math.max(1, p);
    setTipOut("Each: $" + each.toFixed(2) + " (Tip: $" + tipAmt.toFixed(2) + ")");
  };

  const conv = () => {
    const a = parseFloat(amt) || 0;
    const r = parseFloat(rate) || 1;
    setCurOut((a * r).toFixed(2) + " (converted)");
  };

  const pwgen = () => {
    const len = Math.max(4, Math.min(64, parseInt(plen, 10) || 16));
    const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=";
    let s = "";
    for (let n = 0; n < len; n++) s += chars.charAt(Math.floor(Math.random() * chars.length));
    setPw(s);
  };

  const age = () => {
    if (!dob) return setAgeOut("");
    let d = new Date(dob);
    if (isNaN(d.getTime())) {
      const parts = dob.trim().split(/[-/]/);
      if (parts.length === 3) {
        if (parts[2].length === 4) {
          d = parts[0] > 12 ? new Date(parts[2], parts[1]-1, parts[0]) : new Date(parts[2], parts[0]-1, parts[1]);
        }
      }
    }
    if (isNaN(d.getTime())) return setAgeOut("Invalid date format");
    const today = new Date();
    let yrs = today.getFullYear() - d.getFullYear();
    const m = today.getMonth() - d.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < d.getDate())) yrs--;
    setAgeOut(yrs >= 0 ? yrs + " years old" : "Invalid date");
  };

  function getLuminance(hex) {
    hex = (hex || "").replace("#", "");
    if (hex.length === 3) hex = hex.split("").map(c => c + c).join("");
    const r = parseInt(hex.substr(0, 2), 16) / 255;
    const g = parseInt(hex.substr(2, 2), 16) / 255;
    const b = parseInt(hex.substr(4, 2), 16) / 255;
    const a = [r, g, b].map(v => isNaN(v) ? 0 : v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
    return a[0] * 0.2126 + a[1] * 0.7152 + a[2] * 0.0722;
  }

  const contrast = () => {
    try {
      const l1 = getLuminance(fg);
      const l2 = getLuminance(bg);
      const ratio = (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
      const pass = ratio >= 4.5;
      setConOut(ratio.toFixed(2) + ":1 " + (pass ? "✅ PASS (AA)" : "❌ FAIL"));
    } catch (e) {
      setConOut("Invalid hex");
    }
  };

  return (
    <div className="grid">
      <Tool icon="📏" title="KM → Miles" hint="Convert kilometres to miles instantly">
        <input placeholder="Enter km (e.g. 100)" value={km} onChange={e => setKm(e.target.value)} />
        <div className="out">{km ? (parseFloat(km) * 0.621371).toFixed(2) + " miles" : "0.00 miles"}</div>
      </Tool>
      <Tool icon="⚖️" title="BMI Calc" hint="Body Mass Index calculator">
        <input placeholder="Weight (kg) e.g. 70" value={wt} onChange={e => setWt(e.target.value)} />
        <input placeholder="Height (cm) e.g. 175" value={ht} onChange={e => setHt(e.target.value)} />
        <span className="go" onClick={bmi}>Calculate →</span>
        <div className="out">{bmiOut}</div>
      </Tool>
      <Tool icon="🍕" title="Tip Split" hint="Split the bill with friends">
        <input placeholder="Total Bill ($)" value={bill} onChange={e => setBill(e.target.value)} />
        <input placeholder="Tip % (e.g. 15)" value={tip} onChange={e => setTip(e.target.value)} />
        <input placeholder="Number of people (e.g. 3)" value={ppl} onChange={e => setPpl(e.target.value)} />
        <span className="go" onClick={tipcalc}>Split →</span>
        <div className="out">{tipOut}</div>
      </Tool>
      <Tool icon="💱" title="Currency" hint="Convert USD to world currencies">
        <input placeholder="Amount (USD)" value={amt} onChange={e => setAmt(e.target.value)} />
        <select value={rate} onChange={e => setRate(e.target.value)}>
          <option value="83">USD → INR (₹83)</option>
          <option value="0.92">USD → EUR (€0.92)</option>
          <option value="150">USD → JPY (¥150)</option>
          <option value="0.000015">USD → BTC (₿0.000015)</option>
        </select>
        <span className="go" onClick={conv}>Convert →</span>
        <div className="out">{curOut}</div>
      </Tool>
      <Tool icon="🔐" title="Password Gen" hint="Generate strong random password">
        <input type="number" min="6" max="64" value={plen} onChange={e => setPlen(e.target.value)} />
        <span className="go" onClick={pwgen}>Generate →</span>
        <div className="out" style={{fontSize: "16px"}}>{pw}</div>
      </Tool>
      <Tool icon="🎂" title="Age Calc" hint="Enter YYYY-MM-DD or MM/DD/YYYY">
        <input placeholder="YYYY-MM-DD" value={dob} onChange={e => setDob(e.target.value)} />
        <span className="go" onClick={age}>How old am I →</span>
        <div className="out">{ageOut}</div>
      </Tool>
      <Tool icon="♿" title="WCAG Checker" hint="Test color contrast (hex colors)">
        <input placeholder="Foreground (#000000)" value={fg} onChange={e => setFg(e.target.value)} />
        <input placeholder="Background (#ffffff)" value={bg} onChange={e => setBg(e.target.value)} />
        <span className="go" onClick={contrast}>Check Contrast →</span>
        <div className="out">{conOut}</div>
      </Tool>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
